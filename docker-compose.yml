services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: metalmics:latest
    container_name: metalmics-server
    command: ["go", "run", "./cmd/server"]
    environment:
      PORT: ${PORT:-8080}
      DB_PATH: ${DB_PATH:-/data/metalmics.db}
      GOTOOLCHAIN: local
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - metalmics-data:/data
    restart: unless-stopped

volumes:
  metalmics-data:
